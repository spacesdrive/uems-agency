version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions in the workflow up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
